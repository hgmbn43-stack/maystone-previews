name: Hourly live check
# 25 Nov 2026: every hour, open 15 random previews on the real site and check every shared file loads.
# A failure here makes GitHub email the account owner. To undo the site by hand, run "Build and deploy previews"
# from the Actions tab with "ref" set to last-good (works from the GitHub phone app too).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python engine/check_site.py --live "https://hgmbn43-stack.github.io/maystone-previews/" 15
