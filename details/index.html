<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Your website details – Maystone</title><style>:root{--brand:#0d3b66;--ink:#172027;--soft:#52606b;--line:#d5dbe0;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 64px}h1{font-size:1.6rem;line-height:1.2;margin:.2rem 0 .4rem}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0;display:grid;gap:12px}h2{font-size:1.1rem;margin:0}label{display:grid;gap:4px;font-weight:600;font-size:.95rem}.hint{font-weight:400;color:var(--soft);font-size:.88rem}input,textarea{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;width:100%;background:#fff}textarea{min-height:90px}input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,59,102,.2)}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}button{font:700 1rem system-ui;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:14px;cursor:pointer;width:100%}button:disabled{opacity:.6}.msg{padding:12px;border-radius:8px;display:none}.ok{background:#e7f6ee;color:#1f7a4d;display:block}.err{background:#fdecec;color:#a12626;display:block}.brand{font-weight:800;letter-spacing:.02em;color:var(--brand)}</style></head><body><div class="wrap"><div class="brand">MAYSTONE</div><h1>Your website details</h1><p id="intro" class="hint" style="font-size:1rem">Thanks for choosing us! Send your photos and details below and we'll put them on your site. It takes about 5 minutes. You can send this form again later to update anything.</p><form id="f"><div class="card"><h2>Your business</h2><label>Business name<input name="business" value="" maxlength="80"></label><label>Phone number for the website<input name="phone" value="" maxlength="30"></label><label>Email for website enquiries <span class="hint">New enquiries from your site get sent here.</span><input name="email" type="email" value="" maxlength="120"></label></div><div class="card"><h2>Photos</h2><label>Photos of your work <span class="hint">Up to 12. Your best one first, it goes at the top of the site.</span><input id="photos" type="file" accept="image/*" multiple></label><div class="thumbs" id="pt"></div><label>Your logo <span class="hint">Optional.</span><input id="logo" type="file" accept="image/*"></label><div class="thumbs" id="lt"></div></div><div class="card"><h2>Trust badges</h2><label>Registrations and memberships <span class="hint">e.g. Gas Safe 123456, NICEIC, FMB member, TrustMark. Leave blank if none.</span><input name="reg" maxlength="160"></label><label>Insurance and guarantees <span class="hint">e.g. £2m public liability, 12-month workmanship guarantee.</span><input name="insurance" maxlength="160"></label><label>Company details <span class="hint">Only if you're a Ltd company: company number and registered office.</span><input name="company" maxlength="240"></label></div><div class="card"><h2>Web address</h2><label>Do you already own a web address? <span class="hint">e.g. smithsplumbing.co.uk. Leave blank if not.</span><input name="domain_have" maxlength="120"></label><label>If not, any ideas for one? <span class="hint">We'll check what's available and set it up.</span><input name="domain_ideas" maxlength="200"></label></div><div class="card"><h2>Anything to change?</h2><label>Services, wording, areas you cover… <span class="hint">Tell us anything that's wrong or missing.</span><textarea name="changes" maxlength="3000"></textarea></label></div><div id="m" class="msg"></div><button id="b" type="submit">Send my details</button></form></div><script>var API="https://script.google.com/macros/s/AKfycbyHy9OQT8lM1U_xwEg2rpJqCG1PZApcAKPNbtpDUzI1Gw-Btro7IwNEr-GZwHxXf3Er/exec";var q=new URLSearchParams(location.search),ID=q.get("id")||"",K=q.get("k")||"";fetch(API+"?info="+encodeURIComponent(ID)+"&k="+encodeURIComponent(K),{credentials:"omit"}).then(function(r){return r.json();}).then(function(j){if(!j.ok){document.getElementById("f").style.display="none";var m=document.getElementById("m");m.className="msg err";m.textContent="This link has expired or is not valid. Reply to our email and we'll send a new one.";document.querySelector(".wrap").appendChild(m);return;}var f=document.getElementById("f");f.business.value=j.biz||"";f.phone.value=j.phone||"";f.email.value=j.email||"";document.getElementById("intro").textContent="Thanks for choosing us! Send your photos and details below and we'll put them on your site for "+j.biz+". It takes about 5 minutes. You can send this form again later to update anything.";}).catch(function(){});var photos=[],logo=null;function shrink(file,max,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,max/Math.max(i.width,i.height));var c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(file.type==="image/png"&&max<1000?"image/png":"image/jpeg",0.82));};i.onerror=function(){cb(null)};i.src=r.result;};r.readAsDataURL(file);}function thumbs(el,list){el.innerHTML="";list.forEach(function(u){var im=document.createElement("img");im.src=u;el.appendChild(im);});}document.getElementById("photos").onchange=function(e){photos=[];var fs=[].slice.call(e.target.files,0,12),n=fs.length;if(!n)return thumbs(document.getElementById("pt"),[]);var out=new Array(n);fs.forEach(function(f,ix){shrink(f,1600,function(u){out[ix]=u;if(--n===0){photos=out.filter(Boolean);thumbs(document.getElementById("pt"),photos);}});});};document.getElementById("logo").onchange=function(e){var f=e.target.files[0];logo=null;if(!f)return;shrink(f,600,function(u){logo=u;thumbs(document.getElementById("lt"),u?[u]:[]);});};document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var b=document.getElementById("b"),m=document.getElementById("m");b.disabled=true;b.textContent="Sending…";m.className="msg";var d={};new FormData(ev.target).forEach(function(v,k){d[k]=v;});var files=photos.map(function(u,i){return{name:String(i+1),dataUrl:u};});if(logo)files.push({name:"logo",dataUrl:logo});fetch(API,{method:"POST",body:JSON.stringify({action:"details",id:ID,k:K,data:d,photos:files}),credentials:"omit"}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||"failed");m.className="msg ok";m.textContent="Thanks, got it! We'll update your website and let you know when it's ready.";b.textContent="Sent";}).catch(function(er){m.className="msg err";m.textContent="Something went wrong: "+(er&&er.message||er)+". Please try again or reply to our email.";b.disabled=false;b.textContent="Send my details";});};</script></body></html>
